<!--
Mermaid diagrams, loaded only on pages with `isMermaid: true` in the front matter,
following the same pattern as mathJax.html.

Why the DOM rewriting: depending on the highlighter configuration, kramdown turns a
```mermaid fence into either <div class="language-mermaid highlighter-rouge"><div
class="highlight"><pre><code>... or (as GitHub Pages builds this site) a bare
<pre><code class="language-mermaid">. Each code block is read with textContent
(which decodes entities and drops any syntax-highlight spans) and the WHOLE block,
<pre> included, is replaced by a <div class="mermaid"> holding the raw source.
Leaving the <pre> in place makes labels inherit `pre { word-break: break-all }`.
-->

<!--
Pinned to the major, so 12.x patches arrive without an edit and 13 never does by surprise.
Bumped 11 -> 12 on 2026-09-30, after checking that `initialize(config)` and `run({nodes})` -
the only two APIs used below - are both still present in the 12.0.0 type declarations.
-->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs';

  const isDark = () =>
    document.documentElement.getAttribute('data-theme') === 'dark';

  const blocks = [];
  document.querySelectorAll('code.language-mermaid, .language-mermaid code').forEach((code) => {
    const source = code.textContent;
    // Replace the whole block, not just the <code>. GitHub Pages emits a bare
    // <pre><code class="language-mermaid"> with no wrapper div, so
    // closest('.language-mermaid') matches the <code> itself; replacing only
    // that left the diagram inside the <pre>, which inherited
    // `pre { word-break: break-all }` and split label words mid-word.
    const pre = code.closest('pre');
    const host = code.closest('div.language-mermaid')
      || (pre && pre.closest('div.highlighter-rouge'))
      || pre
      || code;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = source;
    host.replaceWith(div);
    blocks.push(div);
  });

  // Second line of defence: whatever the diagram ends up nested in, its labels
  // must wrap only at spaces, as Mermaid sized them.
  if (blocks.length) {
    const style = document.createElement('style');
    style.textContent =
      '.mermaid, .mermaid * { word-break: normal; overflow-wrap: normal; }';
    document.head.appendChild(style);
  }

  if (blocks.length) {
    const render = () => {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: isDark() ? 'dark' : 'default',
      });
      // mermaid.run() skips nodes it has already processed, so keep the source
      // on the element and restore it before each re-render.
      blocks.forEach((d) => {
        if (d.dataset.source === undefined) d.dataset.source = d.textContent;
        else {
          d.removeAttribute('data-processed');
          d.textContent = d.dataset.source;
        }
      });
      mermaid.run({ nodes: blocks });
    };

    render();

    // Re-render when the visitor switches theme, so diagrams follow the page.
    new MutationObserver(render).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });
  }
</script>
