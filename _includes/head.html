<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>


  <!-- title, meta description and rel=canonical are all emitted by the jekyll-seo-tag
       call further down. Do not add them here: duplicate tags confuse crawlers. -->

  <link rel='alternate' type='application/rss+xml' title='{{ site.title }}'
        href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">
  
 <!-- Fonts -->
  <!--<link href="https://fonts.googleapis.com/css?family=Volkhov:400,700" rel="stylesheet">-->
  <link href="{{ site.baseurl }}/fonts/volokhov.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.baseurl }}/fonts/katex.min.css"
        integrity="sha384-zB1R0rpPzHqg7Kpt0Aljp8JPLqbXI3bhnPWROx27a9N0Ll6ZP/+DiW/UqRcLbRjq" crossorigin="anonymous">

  <!--SEO-->
  {% seo %}
  {% include breadcrumbs.html %}
  <style>
    {% capture include_to_scssify %}
      {% include main.scss %}
    {% endcapture %}
    {{ include_to_scssify | scssify }}
  </style>
</head>
