<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>


  <!-- title, meta description and rel=canonical are all emitted by the jekyll-seo-tag
       call further down. Do not add them here: duplicate tags confuse crawlers. -->

  <link rel='alternate' type='application/rss+xml' title='{{ site.title }}'
        href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">

  <!-- Fonts — both self-hosted, so no third-party request is made on page load.
       Open Sans was previously pulled from fonts.googleapis.com (render-blocking,
       and a GDPR consideration for EU visitors). See fonts/opensans.css. -->
  <link href="{{ '/fonts/volokhov.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/fonts/opensans.css' | relative_url }}" rel="stylesheet">

  <!-- Stylesheet. Served as a real file so browsers cache it once for the whole
       site, instead of being inlined into every page's <style> block. -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!--SEO-->
  {% seo %}
  {% include breadcrumbs.html %}
</head>
