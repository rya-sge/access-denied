# ---------------------------------------------------------------------------
# Article series.
#
# A post joins one by declaring `series: <key>` in its front matter, and
# _includes/series-nav.html then renders the whole group at the top of the
# article and emits the CreativeWorkSeries / hasPart structured data.
#
# `ordered: true`  - a reading order exists, so the box says "Part N of M" and
#                    every member carries a `series_order:` integer.
# `ordered: false` - the articles cover one subject with no intended order (four
#                    independent studies of the same protocol, write-ups of
#                    separate contests). The box lists them without numbering.
#
# Claiming an order that the articles do not actually have would be worse than
# claiming none: it tells a reader to start somewhere the author never chose.
# ---------------------------------------------------------------------------

windows-sos:
