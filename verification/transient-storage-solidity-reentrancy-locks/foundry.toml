# Pinned compiler and EVM. Run from this directory. See README.md.
[profile.default]
src = "src"
test = "test"
out = "out/default"
cache_path = "cache/default"
libs = []
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Each top-level call made by a test function is a separate transaction, so
# transient storage is cleared between them. A single transaction is modelled
# with one call into src/Common.sol:Tx.
isolate = true
offline = true
ignored_error_codes = [5159, 9207, 2394]

# solc TransientStorageClearingHelperCollision: same sources, compiler and pipeline vary.
