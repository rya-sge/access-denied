title: AccessDenied
description: Blog specialized on Security, Crypto and blockchain.
baseurl: "/access-denied" # the subpath of your site, e.g. /blog
url: "https://rya-sge.github.io" # the base hostname & protocol for your site, e.g. http://example.com
url_complet: "https://rya-sge.github.io/access-denied" #image
# Consumed by jekyll-seo-tag as the default og:locale, so it must use the
# language_TERRITORY form. The site is ~82% English (209 EN posts vs 48 FR);
# per-page overrides come from each post's own `lang:` front matter.
lang: "en_GB"

# Author
author-name:    Ryan S.
author-image:   1.jpg

# jekyll-seo-tag reads `author`, `logo` and `social` (it does NOT read the
# `author-name` / `social-*` keys above, which are only used by the templates).
# These populate the JSON-LD author/publisher blocks and the social profile links.
author: Ryan S.
logo: /assets/1.jpg
twitter:
  username: ADCDIII
  card: summary_large_image
social:
  name: Ryan S.
  links:
    - https://x.com/ADCDIII
    - https://github.com/rya-sge
    - https://www.linkedin.com/in/ryan-sge
    - https://bsky.app/profile/ad403.bsky.social
#Source : https://pixabay.com/fr/vectors/pas-d-entrée-signer-attention-909933/
author-job:     Security engineer | Blockchain Developer
author-email:    # Add your email for contant form.
#author-twitter: artemsheludko_ # Add your twitter account
about-author:   "Blog specialized on Security, Crypto and blockchain."

# Social settings
social-twitter:   ADCDIII
#social-facebook:
social-github:    rya-sge
#social-pinterest: artemsheludko
#social-instagram: artemsheludko_
#social-youtube:
#social-vk:
social-linkedin: ryan-sge
social-bluesky: ad403.bsky.social
repository: rya-sge/access-denied
# Newsletter
mailchimp: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e

# Google Analytics
google-analytics: # Add your identifier. For example UA-99631805-1

# Comment Section (Disqus)
disqus-identifier:
  #https-rya-sge-github-io-access-denied  #Add your shortname for Disqus Comment. For example mr-brown

# Build settings
markdown: kramdown


permalink: /:year/:month/:day/:title/



plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  # Ships with the pinned `github-pages` gem (v232 -> jekyll-redirect-from 0.16.0)
  # and is on GitHub Pages' supported-plugin list, so it runs under the classic
  # safe-mode build as well as the Actions build. Used by `redirect_from:` on a
  # post whose URL changed; see _posts/2024-03-28-ethereum-staking.md.
  - jekyll-redirect-from
#  - jekyll-katex

paginate: 7
paginate_path: "/page/:num/"

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing.
#
# IMPORTANT: GitHub Pages force-enables the `jekyll-optional-front-matter`
# plugin, which turns EVERY markdown file without front matter into a rendered
# page. Jekyll runs Liquid *before* markdown, so ``` code fences do NOT protect
# Liquid tags — a `{% if %}` quoted inside a fenced block in an internal note is
# parsed for real and fails the build with a Liquid exception.
#
# => Any internal .md doc that quotes Liquid MUST be listed here.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - draft
  # Internal notes: never meant to be published, and several quote Liquid.
  - feedback.md
  - multi-language.md
  - site_improvement.md
  - SEO_IMPROVEMENT.md
  - improvement_31.md
  - CLAUDE.md
  - DEPENDENCE.md
  - polyfills.md
  - article_list.md
  - tree.txt
  - README.md
  - LICENSE.txt
  # Diagram sources (~1.8 MB of .drawio / .excalidraw). Kept in the repo as the
  # source of truth, but there is no reason to publish them.
  - schema
