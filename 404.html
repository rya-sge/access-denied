---
layout: home
title: Page not found
permalink: /404.html
---

<style media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 60px;
    line-height: 1;
    letter-spacing: -1px;
  }
</style>

{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
<div class="container">
  <header class="c-header u-hide u-no-margin-bottom">
    <div class="c-header__box">
      {% include search-box.html class="u-full-width" %}
    </div>
  </header>
  <h1>404</h1>
  <p><strong>{{ t.not_found_title }}</strong></p>
  <p>{{ t.not_found_text }}</p>
  <p><a href="{{site.baseurl}}/">{{ t.not_found_link }}</a></p>
</div>
